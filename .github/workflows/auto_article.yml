name: Auto-Publish Trending Culinary Article

on:
  schedule:
    # Runs every Monday and Thursday at 10:00 AM UTC
    - cron: '0 10 * * 1,4'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  publish-trending-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Trending Article Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_article_publisher.py

      - name: Commit and Push New Article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/articles.json assets/js/main.js index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-published trending culinary article [skip ci]"
            git push origin main
          fi
